bind-key C-c display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "tmux new-session -A -s q-popup 'source ~/.zprofile && claude'"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:Tc"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g focus-events on

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

bind-key * choose-tree -Zw "join-pane -s '%%'"

unbind %
unbind i
bind i split-window -h -c '#{pane_current_path}'
unbind '"'
unbind u
bind u split-window -v -c '#{pane_current_path}'
unbind c
bind c new-window -c '#{pane_current_path}'

set -g @tpm-install 'I'
set -g @tpm-update 'U'

unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded ✅"

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(n?vim|vim|view|fzf)$'"

bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

bind -r m resize-pane -Z

set -g mouse on
set -ga allow-passthrough on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
# クリップボード
# macOS
if-shell 'uname | grep -qi darwin' \
    "bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'" \
    ""
# WSL
if-shell 'grep -qi microsoft /proc/version' \
  'bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "iconv -f UTF-8 -t CP932 | clip.exe"' \
  ""

bind < swap-pane -U
bind > swap-pane -D
set-option -g status-position top

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode after dragging with mouse

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
# --- Catppuccin Theme ---
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_pane_active_border_style "fg=#{@thm_blue}"

run '~/.tmux/plugins/tpm/tpm'

set -g pane-border-status top
set -g pane-border-lines heavy
set -g pane-border-format "#{pane_index} #{pane_title}"
